server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # O TLS termina no Traefik do EasyPanel; aqui só chega HTTP. Sem isto, o
  # redirect de "/pasta" para "/pasta/" sai como http:// e faz um desvio pelo
  # HTTP antes de voltar ao HTTPS.
  absolute_redirect off;

  # Um endereço só para o Google e para os links compartilhados.
  if ($host = www.katoodontologia.com.br) {
    return 301 https://katoodontologia.com.br$request_uri;
  }

  # HSTS: o navegador passa a ir direto ao HTTPS por um ano. Só vale para o
  # host exato (sem includeSubDomains). Um add_header dentro de location
  # descarta os do server, por isso ele se repete nos blocos que têm os seus.
  add_header Strict-Transport-Security "max-age=31536000" always;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
  }

  location ~* \.(?:avif|webp|png|jpe?g|svg|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
  }

  location = /favicon.ico {
    expires 30d;
    access_log off;
    log_not_found off;
  }

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  error_page 404 /404.html;
}
